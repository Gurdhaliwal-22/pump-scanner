name: paper-trading
on:
  schedule:
    - cron: "35 15 * * *"    # 21:05 IST daily, after NSE/USDINR close and the crypto window
    - cron: "35 17 * * *"    # 23:05 IST backup run (skips days already done)
  workflow_dispatch: {}
concurrency:
  group: paper-trading
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: cd paper && python -m unittest test_paperbook
      - run: cd paper && python paperbook.py
      - name: save results
        run: |
          git config user.name "paper-bot"; git config user.email "paper-bot@users.noreply.github.com"
          git add paper/ledger.json paper/REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "paper $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
