name: pump-scan
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay a few minutes)
  workflow_dispatch: {}
concurrency:
  group: pump-scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python pump_scanner.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: save state
        run: |
          git config user.name "pump-bot"; git config user.email "pump-bot@users.noreply.github.com"
          git add pump_paper.json pump_seen.json
          git diff --cached --quiet || git commit -m "scan $(date -u +%H:%M)"
          git pull --rebase -q || true
          git push -q || true
