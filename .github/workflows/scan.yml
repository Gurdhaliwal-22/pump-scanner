name: pump-scan
on:
  schedule:
    - cron: "*/30 * * * *"   # each run scans every minute for ~55 min; a late/queued run fills the gap
  workflow_dispatch: {}
concurrency:
  group: pump-scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: |
          git config user.name "pump-bot"; git config user.email "pump-bot@users.noreply.github.com"
          python pump_scanner.py --minutes 55 --commit-every 10
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: save state
        run: |
          git config user.name "pump-bot"; git config user.email "pump-bot@users.noreply.github.com"
          git add pump_paper.json pump_seen.json
          git diff --cached --quiet || git commit -m "scan $(date -u +%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
